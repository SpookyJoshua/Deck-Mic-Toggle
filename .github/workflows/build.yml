name: Build Deck Mic Toggle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Assemble Decky distribution ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/DeckMicToggle
          cp -r dist release/DeckMicToggle/
          cp main.py package.json plugin.json README.md LICENSE release/DeckMicToggle/
          test -f release/DeckMicToggle/dist/index.js
          test -f release/DeckMicToggle/main.py
          test -f release/DeckMicToggle/package.json
          test -f release/DeckMicToggle/plugin.json
          test -f release/DeckMicToggle/LICENSE
          echo "Distribution contents:"
          find release/DeckMicToggle -maxdepth 2 -type f -print

      - name: Create installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd release
          zip -r "../DeckMicToggle-${GITHUB_REF_NAME:-manual}.zip" DeckMicToggle

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeckMicToggle-installable
          path: DeckMicToggle-*.zip
          if-no-files-found: error

      - name: Create GitHub release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DeckMicToggle-*.zip
          generate_release_notes: true
