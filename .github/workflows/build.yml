name: Build Deck Mic Toggle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build frontend
        run: pnpm run build

      - name: Assemble plugin package
        run: |
          set -eux
          mkdir -p release/DeckMicToggle
          cp -r dist release/DeckMicToggle/
          cp main.py plugin.json README.md LICENSE release/DeckMicToggle/
          echo "Build contents:"
          find release/DeckMicToggle -maxdepth 2 -type f -print

      - name: Create installable ZIP
        run: |
          cd release
          zip -r ../DeckMicToggle.zip DeckMicToggle

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeckMicToggle
          path: DeckMicToggle.zip
          if-no-files-found: error

      - name: Create GitHub release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DeckMicToggle.zip
          generate_release_notes: true
